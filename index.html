<!DOCTYPE html>
<html lang="tr">
<head>

<title>Epigram — Atasözleri & Deyimler</title>
<meta name="description" content="Epigram: atasözleri ve deyimlerle şifreli kelime bulmacası. İpuçlarını çöz, harfler söze uçsun.">
<style>
  :root { --ink:#1f2a24; --sub:#55635b; --green:#2f6b4f; --pink:#c44068; --bg:#f6f4ec; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(#d6e9f2, var(--bg) 60%); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  main { max-width:560px; padding:40px 24px; text-align:center; }
  .logo { width:88px; height:88px; margin:0 auto 18px; border-radius:22px; background:var(--green); color:#f3d36b; font:700 52px/88px Georgia, serif; box-shadow:0 12px 30px rgba(47,107,79,.25); }
  h1 { font:700 40px/1.15 Georgia, "Times New Roman", serif; margin:0 0 6px; }
  h1 em { color:var(--pink); }
  p { color:var(--sub); margin:0 0 26px; }
  .btn { display:inline-block; background:#111; color:#fff; text-decoration:none; padding:12px 22px; border-radius:12px; font-weight:600; }
  footer { margin-top:36px; font-size:14px; }
  footer a { color:var(--green); margin:0 8px; }
</style>
</head>
<body>
<main>
  <div class="logo">E</div>
  <h1>Gizli sözü <em>harf harf</em> aç</h1>
